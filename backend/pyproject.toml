[project]
name = "mixtools-backend"
version = "0.1.0"
description = "Backend de MixTools — Conversor, Word a HTML, Comparador de documentos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pymupdf",
    "img2pdf",
    "pypdf",
    "pdf2docx",
    "mammoth",
    "beautifulsoup4",
    "lxml",
    "python-docx",
    "openpyxl",
    "httpx",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff.lint]
ignore = [
    "B008",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
