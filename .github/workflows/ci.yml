name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  lint-and-test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libreoffice ghostscript

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Instalar dependencias (uv sync, incluye dev)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Tests (si existen)
        run: |
          if [ -d "tests" ]; then uv run pytest; else echo "sin carpeta tests/ todavía"; fi
